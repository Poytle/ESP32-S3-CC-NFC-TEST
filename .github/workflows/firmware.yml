name: Build firmware
on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install platformio==6.1.18 esptool==4.8.1
      - run: python scripts/test_tlv.py
      - run: python scripts/test_pki.py
      - run: node --test tests/ui.test.cjs
      - run: pio run
      - run: python scripts/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: esp32-s3-nfc-${{ github.sha }}
          path: firmware/
          if-no-files-found: error
      - name: Attach firmware to release
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --generate-notes
          fi
          gh release upload "$TAG" firmware/* --clobber
